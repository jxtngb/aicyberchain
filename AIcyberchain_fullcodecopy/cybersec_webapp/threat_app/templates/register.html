<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CyberShield IDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #6610f2;
            --dark: #121826;
            --darker: #0a0e17;
            --light: #f8f9fa;
            --cyber-blue: #00d4ff;
            --cyber-purple: #8a2be2;
        }

        body {
            background: var(--darker);
            color: var(--light);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Animation */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(13, 110, 253, 0.1) 0%, rgba(10, 14, 23, 1) 70%);
        }

        .login-card {
            background: rgba(18, 24, 38, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            color: var(--light);
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--cyber-blue);
            color: var(--light);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .form-select option {
            color: var(--dark);
        }

        .form-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            border: none;
            border-radius: 8px;
            color: var(--dark);
            font-weight: 700;
            padding: 0.75rem;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
            color: white;
        }

        .alert {
            display: none;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .links a {
            color: var(--cyber-blue);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .links a:hover {
            color: var(--cyber-purple);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="bg-animation"></div>

    <div class="login-card">
        <div class="brand-title">
            <i class="fas fa-shield-alt me-2"></i>CyberShield IDS
        </div>

        <h4 class="text-center mb-4">Create Account</h4>

        <div id="error-alert" class="alert alert-danger"></div>
        <div id="success-alert" class="alert alert-success"></div>

        <form id="registerForm">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <select class="form-select" name="role">
                        <option value="User">User</option>
                        <option value="Analyst">Analyst</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" name="phone" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>

                <div class="col-12" style="position: relative;">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="regPassword" required>
                    <i class="fas fa-eye" id="toggleRegPassword"
                        style="position: absolute; right: 25px; top: 38px; cursor: pointer; color: rgba(0, 212, 255, 0.6);"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-user-plus me-2"></i>Sign Up
            </button>
        </form>

        <div class="links">
            <p>Already have an account? <a href="/login/">Login here</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script>
        // Toggle Password
        $("#toggleRegPassword").click(function () {
            const input = $("#regPassword");
            const icon = $(this);
            if (input.attr("type") === "password") {
                input.attr("type", "text");
                icon.removeClass("fa-eye").addClass("fa-eye-slash");
            } else {
                input.attr("type", "password");
                icon.removeClass("fa-eye-slash").addClass("fa-eye");
            }
        });

        $("#registerForm").submit(function (e) {
            e.preventDefault();

            $.ajax({
                type: "POST",
                url: "/register/",
                data: $(this).serialize(),
                success: function (response) {
                    if (response.status === "success") {
                        $("#success-alert").text(response.message).slideDown();
                        $("#error-alert").slideUp();
                        setTimeout(function () {
                            window.location.href = "/login/";
                        }, 1500);
                    } else {
                        $("#error-alert").text(response.message).slideDown();
                        $("#success-alert").slideUp();
                    }
                },
                error: function () {
                    $("#error-alert").text("Registration failed. Please try again.").slideDown();
                }
            });
        });
    </script>
</body>

</html>
